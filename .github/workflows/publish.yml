# Publishes @tablation/client and @tablation/cli to npm when a v* tag is
# pushed (which is what crew's release phase does after a release).
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret anywhere. Each
# package's npmjs.com Settings page must list this repo + this workflow
# filename (publish.yml) + the `npm` environment as its trusted publisher.
# The runner needs npm >= 11.5.1 for OIDC, hence the `npm install -g npm`
# step — pnpm publish shells out to npm, so that is the version that matters.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile
      # build first: the cli package typechecks against client's built dist
      - run: pnpm build
      - run: pnpm typecheck

      - name: Check package versions match the tag
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for pkg in packages/client packages/cli; do
            actual="$(node -p "require('./$pkg/package.json').version")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$pkg is at $actual but the tag is v$expected"
              exit 1
            fi
          done

      # -r publishes in dependency order (client before cli) and skips any
      # package whose version is already on the registry, so a re-run after a
      # partial failure is safe.
      - name: Publish
        run: pnpm -r publish --access public --provenance --no-git-checks
