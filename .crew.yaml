# The crew contract for this repo — see docs/REPO_SPEC.md in the crew repo.
version: 1

# POSIX-shell hooks: macOS or Linux, not Windows.
platform: unix

worktrees:
  # A worktree needs the install to resolve the workspace links; nothing
  # gitignored has to be copied across.
  copy: []

hooks:
  setup: pnpm install --frozen-lockfile

  # There is no test suite in this repo yet — no runner, no test files. The
  # type check is the only real gate available, so it is declared as `test`
  # deliberately and not as a stand-in for one: it catches the class of error
  # a published client can least afford (a wrong type reaching a consumer),
  # and it is honest about being all there is. A real suite replaces this.
  test: pnpm -r typecheck

  build: pnpm -r build

  # cli publishes last (pnpm -r publishes in dependency order), so its version
  # appearing on npm is the signal that the whole release is live.
  released: npm view @tablation/cli version

release:
  # The release phase bumps, changelogs, commits `Release vX.Y.Z` and pushes
  # main plus the annotated tag; .github/workflows/publish.yml (tag-triggered,
  # OIDC) publishes client then cli.
  mode: ci_auto
  ci:
    provider: github

  # Both packages move in lockstep: publish.yml refuses a tag that does not
  # equal each package's version. The root package.json stays unversioned.
  versioning: auto
  versionFiles:
    - packages/client/package.json
    - packages/cli/package.json
  changelog: CHANGELOG.md

  verify:
    match: version
    timeoutSeconds: 900
    intervalSeconds: 20
